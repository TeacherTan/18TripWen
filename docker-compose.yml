services:
  postgres:
    image: postgres:16-alpine
    container_name: 18trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 18trip
      POSTGRES_USER: 18trip
      POSTGRES_PASSWORD: 18trip_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 18trip -d 18trip"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
